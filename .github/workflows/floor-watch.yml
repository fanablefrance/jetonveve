# ═══════════════════════════════════════════════════════════════════════
      # 📓 LOT 147 — LE JOURNAL DES PRIX : 1 POINT PAR PIÈCE ET PAR JOUR
      # ═══════════════════════════════════════════════════════════════════════
      # Preda, 13/08 : « je veux un suivi quotidien une fois par jour des prix ».
      # ⭐⭐⭐ RIEN A COLLECTER DE PLUS : cette etape observe deja 6 229 pieces
      # cote VeVe et ~900 cote StackR a CHAQUE run horaire, et `releves.csv`
      # ecrase la photo precedente. 24 observations par jour partaient a la
      # poubelle. Ce bloc ARRETE DE JETER — il n'ajoute AUCUN appel reseau vers
      # VeVe ou StackR, seulement un aller-retour de release.
      #
      # ⛔ IL NE ROUGIT PAS LE RUN. Les alertes sont le produit ; le journal est
      # un passager. Un KO ici ecrit une ANNOTATION `::warning::` (lisible par
      # `api.github.com/.../runs/<id>/annotations`) et poste sur Discord si le
      # webhook est la. ⭐ « Poser ≠ brancher » : le `if` verifie le webhook.
      #
      # ⏱️ Cout mesure sur l'etat reel (4,1 Mo) : 0,21 s de calcul, 180 Ko de
      # journal le 1er jour, ~5,2 Mo gzip au bout d'un mois plein.
      - name: "📓 Journal des prix (lot 147)"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_ALERTE_TECH_WEBHOOK: ${{ secrets.DISCORD_ALERTE_TECH_WEBHOOK }}
        run: |
          set -u
          [ -f data/floor_state.json ] || { echo "etat absent — rien a journaliser."; exit 0; }

          alerte() {
            echo "::warning title=Journal des prix::$1"
            [ -n "${DISCORD_ALERTE_TECH_WEBHOOK:-}" ] && \
              curl -s -H "Content-Type: application/json" \
                   -d "{\"content\": \"📓 **Journal des prix** — $1\"}" \
                   "$DISCORD_ALERTE_TECH_WEBHOOK" >/dev/null || true
            exit 0
          }

          # 1️⃣ LE BANC D'ABORD. jetonveve n'a AUCUN workflow de tests : un banc
          #    pose dans `tests/` y serait MUET (zero run, zero rouge, et le
          #    silence ressemble a un succes). Il tourne donc ICI, avant
          #    d'ecrire quoi que ce soit. 47 controles, < 1 s.
          python3 tests/test_journal_prix.py || alerte "BANC ROUGE — le journal n'a pas ete touche."

          # 2️⃣ Les mois qu'on peut toucher : le mois courant, et le precedent
          #    pendant les 25 premieres heures du mois (la fenetre de fraicheur
          #    enjambe la bascule). ⛔ PAS `--pattern "prix-*"` : au bout d'un
          #    an ce serait 60 Mo telecharges toutes les heures pour rien.
          mkdir -p /tmp/journal
          M1=$(date -u +%Y-%m)
          M0=$(date -u -d '25 hours ago' +%Y-%m)
          gh release view journal-prix >/dev/null 2>&1 || \
            gh release create journal-prix --title "Journal des prix (1 point/piece/jour)" \
              --notes "Un fichier par mois : prix-AAAA-MM.csv.gz · colonnes veve_uuid,jour,ts_obs,source,floor,unite · le jour est celui de l'OBSERVATION, jamais du run · ⛔ deux marches : source=veve en USD, source=stackr en OMI, aucune conversion."
          DISTANTS=$(gh release view journal-prix --json assets -q '.assets[].name' 2>/dev/null || echo "")
          for M in $M1 $M0; do
            [ -f "/tmp/journal/prix-$M.csv.gz" ] && continue
            gh release download journal-prix --pattern "prix-$M.csv.gz" --dir /tmp/journal --clobber 2>/dev/null || true
            # ⭐⭐⭐ LE GARDE-FOU QUI COMPTE. Un telechargement rate rend un
            #   dossier VIDE — indistinguable d'un mois qui commence. Le mois
            #   repartirait alors de zero et ECRASERAIT la release avec un
            #   fichier d'un jour, EN SORTANT VERT. On ne compare donc pas au
            #   dossier local : on compare a la LISTE DISTANTE.
            if echo "$DISTANTS" | grep -qx "prix-$M.csv.gz" && [ ! -f "/tmp/journal/prix-$M.csv.gz" ]; then
              alerte "prix-$M.csv.gz EXISTE dans la release mais n'a pas pu etre telecharge — on n'ecrit rien (sinon le mois repartirait de zero)."
            fi
          done

          # 3️⃣ Le calcul. Le module refuse d'ecrire un journal qui retrecit,
          #    qui perd une cle, ou dont l'horloge derape (seuil : plus de 1 %
          #    d'observations hors tolerance).
          python3 -m scraper.journal_prix --etat data/floor_state.json --dossier /tmp/journal \
            || alerte "le module a refuse d'ecrire (voir le journal du run) — la release est INTACTE."

          # 4️⃣ Le televersement, mois par mois, avec la meme reprise que l'etat.
          for f in /tmp/journal/prix-*.csv.gz; do
            [ -e "$f" ] || continue
            [ -s "$f" ] || { alerte "$(basename "$f") est vide — non televerse."; }
            ok=""
            for i in 1 2 3; do
              gh release upload journal-prix "$f" --clobber && { ok=1; break; }
              sleep $((i * 10))
            done
            [ -n "$ok" ] || alerte "$(basename "$f") non televerse apres 3 essais."
            echo "  ↑ $(basename "$f") ($(stat -c%s "$f") o)"
          done
