# ⚠️ DEPOT : fanablefrance/jetonveve   ·   CHEMIN : .github/workflows/alerte-tech-ping.yml   (NEUF)
# ═══════════════════════════════════════════════════════════════════════════════
# LA SEULE PREUVE QU'UNE ALERTE PART, C'EST UN MESSAGE DANS LE SALON
# ═══════════════════════════════════════════════════════════════════════════════
#
# 🔗 Le jumeau de celui de `VeVePreda/scrapeur-veve`, ou il a deja servi : son
# run vert du 14/08/2026 est ce qui prouve que le secret y est pose.
#
# 🔴 POURQUOI IL FAUT LE MEME ICI. Les deux alertes ecrites a la main dans ce
# depot (`analytics.yml`, `floor-watch.yml`) sortent en `exit 0` quand le secret
# manque : elles impriment « pas d'alerte envoyee » et le run reste VERT.
# ⇒ Leur silence ne distingue pas « rien n'est casse » de « je ne peux pas
#   prevenir ». Aucune mesure existante ne dit si `DISCORD_ALERTE_TECH_WEBHOOK`
#   est pose sur ce depot. Ce fichier tranche, en une minute.
#
# ⛔⛔ IL NE SE DECLENCHE QUE A LA MAIN. Un ping automatique deviendrait du bruit
# dans le salon, et un salon d'alertes ou tombe du bruit finit par ne plus etre
# lu — ce qui coute exactement ce que l'alerte pretendait faire gagner.
#
# 🔊 CE QU'IL FAUT EN FAIRE, UNE FOIS :
#   Actions -> « Ping de l'alerte technique » -> Run workflow -> Run.
#   Puis REGARDER LE SALON DISCORD. C'est le message dans le salon qui prouve,
#   pas la pastille verte du run.

name: Ping de l'alerte technique

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Texte à ajouter au message (facultatif)"
        required: false
        default: ""

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Le secret existe-t-il ?"
        env:
          HOOK: ${{ secrets.DISCORD_ALERTE_TECH_WEBHOOK }}
        run: |
          set -u
          if [ -z "${HOOK:-}" ]; then
            echo "::error::DISCORD_ALERTE_TECH_WEBHOOK est ABSENT ou VIDE sur ce depot."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Nom EXACT attendu : DISCORD_ALERTE_TECH_WEBHOOK"
            exit 1
          fi
          echo "✅ le secret est present (sa valeur n'est jamais imprimee)."

      # ⭐⭐ `?wait=true` CHANGE LA REPONSE DE DISCORD, ET C'EST TOUT L'INTERET.
      # Sans lui, l'API rend `204 No Content` : on sait que le POST est passe,
      # on ne sait pas OU. Avec lui, elle rend `200` et le message cree, qui
      # porte son `channel_id`. ⇒ le run ne dit plus « j'ai poste quelque part »
      # mais « j'ai poste DANS CE SALON-LA ». Il doit etre le MEME que celui
      # touche par le ping de scrapeur-veve.
      - name: "Poster le ping, et dire dans quel salon"
        env:
          HOOK: ${{ secrets.DISCORD_ALERTE_TECH_WEBHOOK }}
          NOTE: ${{ github.event.inputs.note }}
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 🔴🔴 `set -e` N'EST PAS DECORATIF ICI, IL A ETE AJOUTE APRES UNE
          # MESURE (18/08). Sans lui, le `python3` pouvait echouer et les `echo`
          # qui suivent rendaient l'etape VERTE : « je n'ai pas pu prevenir »
          # devenait identique a « tout va bien » — le defaut meme que ce
          # fichier existe pour debusquer. Eprouve avec un faux Discord :
          # connexion refusee -> etape rouge.
          set -eu

          # ⭐ `python3` NE SERT QU'A FABRIQUER LE JSON — jamais a l'envoyer.
          #   Voir la note « 1010 » sous cette etape : c'est l'ENVOI par urllib
          #   qui se faisait refuser, pas le webhook.
          python3 - > /tmp/charge.json <<'PY'
          import json, os
          msg = ("🧪 **ping — jetonveve** : si tu lis ceci, "
                 "`DISCORD_ALERTE_TECH_WEBHOOK` est bon sur ce depot, et les "
                 "alertes techniques arriveront **ici**.")
          if os.environ.get("NOTE"):
              msg += "\n" + os.environ["NOTE"]
          msg += "\n" + os.environ["LIEN"]
          print(json.dumps({"content": msg, "username": "Sentinelle technique"}))
          PY

          # 🔴🔴🔴 L'ENVOI PASSE PAR `curl`, ET C'EST UNE MESURE DU 18/08.
          # Premier jet : `urllib.request`. Discord a repondu **403, corps
          # « error code: 1010 »**. Ce n'est PAS un code Discord — c'est
          # **Cloudflare**, devant Discord, qui refuse la requete sur la
          # signature du client. `Python-urllib/3.x` y est banni.
          # ⭐⭐⭐ Le meme piege est deja ecrit dans ce projet pour GoChain
          #   (« 403 sur UA Python »). Il ne se limite donc pas a une source :
          #   c'est une propriete de CLOUDFLARE, et Discord est derriere.
          # ⇒ `curl` est le transport DEJA PROUVE ici : les 6 workflows de
          #   veve-sites et les 4 alertes maison postent comme ca, et leurs
          #   messages arrivent. On ne parie pas, on reprend ce qui marche.
          code=$(curl -sS -o /tmp/rep.json -w '%{http_code}' \
                   -X POST -H 'Content-Type: application/json' \
                   --data-binary @/tmp/charge.json "${HOOK}?wait=true")

          echo "reponse HTTP de Discord : $code"
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            # ⭐⭐ DEUX CAUSES, DEUX GESTES — et le premier jet les confondait :
            # il annoncait « webhook invalide » sur un blocage Cloudflare, ce qui
            # envoyait chercher au mauvais endroit.
            if grep -q "error code: 1010" /tmp/rep.json 2>/dev/null; then
              echo "::error::CLOUDFLARE a refuse la requete (1010), pas Discord."
              echo "  ⇒ le webhook n'y est pour rien : c'est le client HTTP qui est banni."
              echo "  ⇒ poster avec curl, jamais avec urllib/requests."
            else
              echo "::error::Discord a refuse le POST (HTTP $code)."
              echo "  ⇒ URL du webhook invalide, revoquee, ou salon supprime."
            fi
            head -c 400 /tmp/rep.json || true
            exit 1
          fi

          python3 - <<'PY' || true
          import json
          try:
              d = json.load(open('/tmp/rep.json'))
              print(f"salon touche  : channel_id = {d.get('channel_id')}")
              print(f"message poste : id = {d.get('id')}")
          except Exception:
              print("(204 sans corps : le POST est passe, le salon n'est pas identifiable)")
          PY

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "⭐ CE RUN VERT NE PROUVE PAS ENCORE GRAND-CHOSE."
          echo "   Il prouve que le secret existe et que Discord a accepte."
          echo "   LA PREUVE, C'EST LE MESSAGE DANS LE SALON. Va le regarder."
          echo "   Il doit tomber au MEME endroit que le ping de scrapeur-veve."
          echo "════════════════════════════════════════════════════════════"
