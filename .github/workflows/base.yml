name: Base locale (veve.duckdb)

# Construit la BASE CONSOLIDEE requetable (transfers CC+IMX unifies/dedupliques,
# holders, ledger, profiles) et la publie en Release "base-locale".
# Preda telecharge veve.duckdb dans Archive/base/ -> analyses ad hoc en session.
# A relancer quand on veut une base fraiche (manuel).
#
# TOURNE SUR JETONVEVE (public = minutes illimitees). Les sources publiques
# (astronema, paolo) se lisent avec le token du job ; les 2 sources du repo
# PRIVE preda (chain-archive-daily + ledger-data) demandent le secret
# PREDA_TOKEN : jeton fine-grained du compte vevepreda, repo scrapeur-veve,
# permission Contents: Read-only — a creer dans Settings > Developer settings
# > Personal access tokens, puis coller dans les secrets de CE repo.
# Sans PREDA_TOKEN : base construite quand meme, sans les 31 derniers jours
# CC ni les tables ledger/profiles.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: veve-base
  cancel-in-progress: false

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install duckdb
        run: pip install duckdb

      # 🔴🔴 AJOUTÉ LE 13/08/2026 — CE CACHE A PUBLIÉ UNE BASE AMPUTÉE.
      # La clé était `archives-immuables-v1`, FIXE. Le nom portait l'hypothèse :
      # « une archive publiée ne change plus ». Elle a changé — une tranche de
      # 400 000 transferts a été ajoutée à `chain-archive` pour réparer un trou.
      # Le run suivant a fait `cache hit`, n'a rien re-téléchargé, et a construit
      # `veve.duckdb` sur 96 fichiers au lieu de 97. Aucune erreur, aucun log.
      # ⭐⭐⭐ UNE CLÉ DE CACHE QUI NE DÉPEND PAS DE CE QU'ELLE CACHE NE PEUT PAS
      # SE PÉRIMER — ET LE `-v1` NE FAIT QUE REPOUSSER LE PROBLÈME D'UN CRAN.
      # ⇒ la clé est maintenant DÉRIVÉE du contenu réel des deux Releases :
      # toute tranche ajoutée, retirée ou de taille différente la change.
      - name: "Empreinte des archives amont (la clé du cache)"
        id: empreinte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A=$(gh release view chain-archive -R astronemagame-maker/astronema \
                --json assets --jq '[.assets[]|select(.name|endswith(".csv.gz"))
                                    |"\(.name):\(.size)"]|sort|join(",")')
          B=$(gh release view imx-archive -R lepaolo/paolo \
                --json assets --jq '[.assets[]|select(.name|endswith(".csv.gz"))
                                    |"\(.name):\(.size)"]|sort|join(",")')
          # ⛔ Un amont injoignable ne doit PAS produire une empreinte stable :
          # ce serait un cache hit sur du vide, donc une base construite sur le
          # cache d'hier sans que rien ne le dise.
          if [ -z "$A" ] || [ -z "$B" ]; then
            echo "⛔ Impossible de lire les Releases amont — on ne devine pas."
            exit 1
          fi
          NA=$(printf '%s' "$A" | tr ',' '\n' | grep -c .)
          NB=$(printf '%s' "$B" | tr ',' '\n' | grep -c .)
          H=$(printf '%s|%s' "$A" "$B" | sha256sum | cut -c1-16)
          echo "cle=archives-$H" >> "$GITHUB_OUTPUT"
          echo "nb_cc=$NA" >> "$GITHUB_OUTPUT"
          echo "amont : $NA tranches CC + $NB IMX -> cle archives-$H"

      - name: Cache archives amont (chain-archive + imx-archive)
        id: cache-static
        uses: actions/cache/restore@v4
        with:
          path: |
            dl_static
            dl_imx
          key: ${{ steps.empreinte.outputs.cle }}

      - name: Telecharger l'archive transferts (si cache absent)
        if: ${{ steps.cache-static.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl_static dl_imx
          gh release download chain-archive --repo astronemagame-maker/astronema --dir dl_static --pattern '*.csv.gz'
          gh release download imx-archive --repo lepaolo/paolo --dir dl_imx --pattern '*.csv.gz'

      - name: Sauver le cache immediatement
        if: ${{ steps.cache-static.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            dl_static
            dl_imx
          key: ${{ steps.empreinte.outputs.cle }}

      # 🔴 IL COMPTE, IL NE DÉDUIT PAS : le nombre de tranches réellement
      # présentes sur le disque doit égaler celui annoncé par la Release.
      # Vrai que le cache ait servi ou non — c'est justement le cas où il a
      # servi qui a produit la base amputée du 13/08.
      - name: "🔴 INVARIANT : autant de tranches sur le disque qu'en Release"
        run: |
          N=$(ls dl_static/*.csv.gz 2>/dev/null | wc -l)
          A=${{ steps.empreinte.outputs.nb_cc }}
          echo "tranches CC : disque=$N · Release=$A (cache-hit=${{ steps.cache-static.outputs.cache-hit }})"
          if [ "$N" -ne "$A" ]; then
            echo "⛔ La base serait construite sur $N tranches alors que la Release en"
            echo "   publie $A. Un cache perime, ou un telechargement incomplet."
            exit 1
          fi
          echo "✅ Toutes les tranches publiees sont la."

      - name: Sources publiques (snapshot holders)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl dl_snap data
          cp -al dl_static/. dl/ 2>/dev/null || cp -r dl_static/. dl/
          gh release download holders-snapshot --repo lepaolo/paolo --dir dl_snap --pattern '*.csv.gz'

      - name: Sources du repo prive preda (continuite + grand livre)
        env:
          GH_TOKEN: ${{ secrets.PREDA_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PREDA_TOKEN absent : base sans les 31 derniers jours CC ni ledger/profiles."
            exit 0
          fi
          gh release download chain-archive-daily --repo VeVePreda/scrapeur-veve --dir dl --pattern '*.csv.gz' \
            || echo "chain-archive-daily inaccessible."
          gh release download ledger-data --repo VeVePreda/scrapeur-veve --dir data --pattern '*.csv.gz' \
            || echo "ledger-data inaccessible."
          ls dl | wc -l && ls data || true

      - name: Construire veve.duckdb
        env:
          BASE_OUT: veve.duckdb
          DUCK_MEM: 12GB   # runner public = 16 Go
        run: python -m scraper.base_build

      - name: Publier (Release base-locale)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view base-locale >/dev/null 2>&1 || \
            gh release create base-locale --title "Base locale consolidee (DuckDB)" \
              --notes "veve.duckdb : transfers (CC+IMX unifies, dedup), holders, ledger, profiles. A telecharger dans Archive/base/. Reconstruire via le workflow 'Base locale'."
          # limite Release = 2 Go/asset -> upload ZIPPE (Windows sait extraire)
          zip -q veve-duckdb.zip veve.duckdb
          gh release upload base-locale veve-duckdb.zip --clobber
          ls -lh veve.duckdb veve-duckdb.zip
